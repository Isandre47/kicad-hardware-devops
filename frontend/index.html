<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Visualisateur de Carte - DevOps</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #1a1a24; color: #fff; overflow: hidden; }
        .iframe-container { height: calc(100% - 62px); width: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="iframe-container">
    <iframe id="ibom-viewer" src=""></iframe>
</div>

<script src="./js/nav.js"></script>

<script>
  // Extraction des paramètres pour charger le bon jumeau numérique
  const urlParams = new URLSearchParams(window.location.search);
  const projectName = urlParams.get('name');

  const iframe = document.getElementById('ibom-viewer');

  if (projectName) {
    const projectStem = projectName.split('.').slice(0, -1).join('.');
    // Nginx pointe vers /data/uploads/nom_du_projet/nom_du_projet-ibom.html
    iframe.src = `/uploads/${projectStem}/index.html`;
  } else {
    // Fallback si aucun projet (démo par défaut)
    iframe.src = "/uploads/index.html";
  }
</script>
</body>
</html>
